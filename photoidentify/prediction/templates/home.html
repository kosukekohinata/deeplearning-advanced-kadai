<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>画像判定アプリ</title>
</head>
<body class="bg-light">  <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="card shadow-sm mb-4">
                    <div class="card-header">
                        <h4 class="my-0 fw-normal">画像アップロード</h4>
                    </div>
                    <div class="card-body text-center">
                        <p class="card-title">判定したい画像をアップロードしてください。</p>
                        <form method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <input id="img_data" type="hidden" name="img_data" />
                            </div>
                            <img id="preview" style="display: none; max-width: 100%; height: auto;" class="img-fluid mb-3 border rounded" />
                            <br>
                            <button type="submit" class="btn btn-primary btn-lg mt-3">判定</button>
                        </form>
                    </div>
                </div>
                {% if predictions %}
                <div id="prediction" class="card shadow-sm">
                    <div class="card-header">
                        <h4 class="my-0 fw-normal">判定結果</h4>
                    </div>
                    <div class="card-body text-center">
                        <p class="card-title">あなたのアップロードした画像はこちらです。</p>
                        <img src="{{ img_data }}" class="img-fluid mb-3 border rounded" style="max-width: 400px;">
                        
                        <h5 class="mt-4">予測結果 Top 5</h5>
                        <table class="table table-striped table-bordered w-75 mx-auto">
                            <thead class="table-dark">
                                <tr>
                                    <th>カテゴリ (Category)</th>
                                    <th>確率 (Score)</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for item in predictions %}
                                <tr>
                                    <td>{{ item.name }}</td>
                                    <td>{{ item.score }}</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
                {% endif %}
                </div>
        </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
        $(function() {
            $('#id_image').on('change', function() {
                var reader = new FileReader();
                reader.onload = function () {
                    $("#preview").attr('src', reader.result);
                    $("#preview").show();
                    $("#img_data").val(reader.result);
                }
                reader.readAsDataURL(this.files[0]);
                $("#prediction").hide();
            });
        });
    </script>
</body>
</html>
